services:
  - type: web
    name: colophon-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false
